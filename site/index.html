<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMSR data browser</title>
<style>
  :root { --bg:#fff; --fg:#1d1f23; --muted:#667; --line:#dde0e6; --accent:#0b5fff; --card:#f6f7f9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#e8eaee; --muted:#9aa1ad; --line:#2b2f37; --accent:#7aa7ff; --card:#1c1f25; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:60rem; margin:0 auto; padding:1rem; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  nav { color:var(--muted); margin-bottom:1rem; word-break:break-word; }
  h1 { font-size:1.4rem; margin:.2rem 0 1rem; }
  input { width:100%; padding:.6rem .7rem; font:inherit; color:inherit; background:var(--card);
          border:1px solid var(--line); border-radius:6px; margin-bottom:1rem; }
  ul { list-style:none; margin:0; padding:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(13rem, 1fr)); gap:.6rem; }
  .grid a, .files a { display:block; padding:.6rem .8rem; background:var(--card);
                      border:1px solid var(--line); border-radius:6px; }
  .grid small { display:block; color:var(--muted); }
  .files { display:grid; grid-template-columns:repeat(auto-fill, minmax(17rem, 1fr)); gap:.4rem; }
  .files a { font:.9rem ui-monospace, monospace; word-break:break-all; }
  .msg { color:var(--muted); }
</style>
</head>
<body>
<main>
  <nav id="crumbs"></nav>
  <div id="app"><p class="msg">Loading…</p></div>
</main>
<script>
(function () {
  var app = document.getElementById('app');
  var crumbs = document.getElementById('crumbs');
  var M = null;

  function h(tag, props, kids) {
    var e = document.createElement(tag);
    for (var k in (props || {})) {
      if (k === 'text') e.textContent = props[k]; else e.setAttribute(k, props[k]);
    }
    (kids || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }
  function a(text, href) { return h('a', { href: href, text: text }); }
  function docHref(g, d, f) { return M.base + [g, d, f].map(encodeURIComponent).join('/'); }
  function count(g) { return g.dirs.reduce(function (n, d) { return n + d.files.length; }, 0); }

  function setCrumbs(parts) {
    crumbs.textContent = '';
    parts.forEach(function (p, i) {
      if (i) crumbs.appendChild(document.createTextNode(' / '));
      crumbs.appendChild(i === parts.length - 1 ? h('span', { text: p[0] }) : a(p[0], p[1]));
    });
  }
  function filterBox(ul) {
    var box = h('input', { type: 'search', placeholder: 'Filter…', 'aria-label': 'Filter' });
    box.addEventListener('input', function () {
      var q = box.value.trim().toLowerCase();
      Array.prototype.forEach.call(ul.children, function (li) {
        li.style.display = li.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
      });
    });
    return box;
  }

  function viewHome() {
    setCrumbs([['Home', '#/']]);
    var out = h('ul', { 'class': 'files' });
    var box = h('input', { type: 'search', placeholder: 'Search all ' + M.total + ' files (3+ characters, e.g. PMC7849619)…' });
    box.addEventListener('input', function () {
      out.textContent = '';
      var q = box.value.trim().toLowerCase(), n = 0;
      if (q.length < 3) return;
      outer: for (var i = 0; i < M.groups.length; i++) {
        var g = M.groups[i];
        for (var j = 0; j < g.dirs.length; j++) {
          var d = g.dirs[j];
          for (var k = 0; k < d.files.length; k++) {
            if (d.files[k].toLowerCase().indexOf(q) >= 0) {
              out.appendChild(h('li', {}, [a(d.files[k], docHref(g.name, d.name, d.files[k]))]));
              if (++n >= 100) break outer;
            }
          }
        }
      }
      if (!n) out.appendChild(h('li', { 'class': 'msg', text: 'No matches.' }));
    });
    var grid = h('ul', { 'class': 'grid' });
    M.groups.forEach(function (g) {
      var link = a(g.name, '#/' + encodeURIComponent(g.name));
      link.appendChild(h('small', { text: count(g) + ' files' }));
      grid.appendChild(h('li', {}, [link]));
    });
    app.appendChild(h('h1', { text: 'DMSR data' }));
    app.appendChild(box); app.appendChild(out); app.appendChild(grid);
  }

  function viewGroup(g) {
    setCrumbs([['Home', '#/'], [g.name]]);
    var ul = h('ul', { 'class': 'grid' });
    g.dirs.forEach(function (d) {
      var link = a(d.name, '#/' + encodeURIComponent(g.name) + '/' + encodeURIComponent(d.name));
      link.appendChild(h('small', { text: d.files.length + ' files' }));
      ul.appendChild(h('li', {}, [link]));
    });
    app.appendChild(h('h1', { text: g.name }));
    app.appendChild(ul);
  }

  function viewDir(g, d) {
    setCrumbs([['Home', '#/'], [g.name, '#/' + encodeURIComponent(g.name)], [d.name]]);
    var ul = h('ul', { 'class': 'files' });
    d.files.forEach(function (f) {
      ul.appendChild(h('li', {}, [a(f, docHref(g.name, d.name, f))]));
    });
    app.appendChild(h('h1', { text: d.name + ' (' + d.files.length + ' files)' }));
    app.appendChild(filterBox(ul)); app.appendChild(ul);
  }

  function route() {
    var p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    var g = p[0] && M.groups.filter(function (x) { return x.name === p[0]; })[0];
    var d = g && p[1] && g.dirs.filter(function (x) { return x.name === p[1]; })[0];
    app.textContent = '';
    if (g && d) viewDir(g, d); else if (g) viewGroup(g); else viewHome();
    window.scrollTo(0, 0);
  }

  fetch('manifest.json')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (m) { M = m; route(); window.addEventListener('hashchange', route); })
    .catch(function (e) { app.textContent = 'Could not load manifest.json (' + e.message + ').'; });
})();
</script>
</body>
</html>
