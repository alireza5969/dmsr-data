name: Annotate HTML

on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: Commit the annotated HTML files back to the branch
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "env/kw_colors.csv"

# The script edits files in place, so never run two copies at once.
concurrency:
  group: annotate-html-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # only needed by the optional "commit results" step

jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # prebuilt Linux binaries from Posit Package Manager

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # No DESCRIPTION file in the repo, so list the packages explicitly.
          # System libraries (e.g. libxml2 for xml2) are resolved automatically.
          packages: |
            any::fs
            any::magrittr
            any::xml2
            any::stringr
            any::dplyr
            any::tibble
            any::future
            any::furrr

      - name: Annotate HTML files
        run: Rscript .github/scripts/annotate-html.R

      # `!cancelled()` so artifacts are still uploaded when some files failed
      - name: Upload annotated HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: annotated-html
          path: data/03_labor/**/*.html
          retention-days: 14
          if-no-files-found: warn

      - name: Upload results log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: annotation-results
          path: output/highlight_res.rds
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit annotated files
        if: ${{ inputs.commit_results }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/03_labor
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Annotate HTML with keyword highlights"
            git push
          fi
